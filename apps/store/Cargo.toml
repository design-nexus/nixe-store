[package]
name = "nixe-store"
version = "0.1.0"
edition = "2024"
description = "A native app store for Omarchy with source-preserving package management"
license = "GPL-3.0-or-later"
repository = "https://github.com/design-nexus/nixe-store"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
alpm = "5.0.2"
alpm-utils = "5.0.0"
anyhow = "1"
async-channel = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "nixe-store"
path = "src/main.rs"

[[bin]]
name = "nixe-store-helper"
path = "src/bin/nixe-store-helper.rs"

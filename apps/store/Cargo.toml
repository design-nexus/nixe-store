[package]
name = "nixe-store"
version = "0.1.0"
edition = "2024"
description = "A native app store for Omarchy with source-preserving package management"
license = "GPL-3.0-or-later"
repository = "https://github.com/design-nexus/nixe-store"

[dependencies]
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
alpm = "5.0.2"
alpm-utils = "5.0.0"
anyhow = "1"
async-channel = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "nixe-store"
path = "src/main.rs"

[[bin]]
name = "nixe-store-helper"
path = "src/bin/nixe-store-helper.rs"
